<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0b14" />
    <script>
      // Apply the saved theme (or the system's) before the first paint, so the page never flashes the other theme.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('serendipia.theme')
        } catch (e) {}
        if (theme !== 'day' && theme !== 'night') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'day' : 'night'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'day' ? '#40e0d0' : '#0d0b14'
      })()
    </script>
    <meta
      name="description"
      content="Instrumento de práctica de guitarra: posiciones de acordes, detector de acordes, teoría y progresiones que suenan solas."
    />
    <!-- Versioned names so browsers drop a favicon they cached from an older build. -->
    <link rel="icon" href="/favicon.ico?v=2.8.1" sizes="32x32" />
    <link rel="icon" href="/icon.svg?v=2.8.1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2.8.1" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="SERENDIPIA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SERENDIPIA — acordes, posiciones y progresiones</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
